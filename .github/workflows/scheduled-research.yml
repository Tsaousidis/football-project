name: Scheduled football research

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger research refresh
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository configuration are required."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/research"