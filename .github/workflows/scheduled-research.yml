name: Manual football schedule check

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Account UUID whose enabled schedule should be checked"
        required: true
        type: string

permissions: {}

concurrency:
  group: scheduled-football-research
  cancel-in-progress: false

jobs:
  refresh-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger research refresh
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_USER_ID: ${{ inputs.user_id }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository configuration are required."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 840 \
            --request GET \
            --get --data-urlencode "user_id=${TARGET_USER_ID}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/research"
